name: Publish

# Publishes to npm whenever you create a GitHub Release.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # enables npm provenance (public repos only)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing (OIDC) requires npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci

      # Guard: the release tag (vX.Y.Z) must match package.json's version,
      # otherwise npm would reject the publish or ship the wrong version.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$PKG'"
            exit 1
          fi

      # Authenticated via OIDC Trusted Publishing — no NPM_TOKEN needed.
      # `npm publish` runs the prepublishOnly script (npm run build) first.
      - run: npm publish --provenance --access public
